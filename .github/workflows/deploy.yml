name: 🚀 Deploy MrDelivery Audit Pro

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: 🌍 Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/mrdelivery.online
            rsync -avz --delete frontend/dist/ /var/www/mrdelivery.online/frontend/dist/
            pm2 restart mrdelivery-api || true
            sudo systemctl reload nginx
            echo "✅ Deploy finalizat la $(date '+%Y-%m-%d %H:%M:%S')"
